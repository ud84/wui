site_name: libWUI официальная документация 🏛️
site_url: https://libwui.org

theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.tabs
    - navigation.sections
  custom_dir: ../overrides

extra_css:
  - assets/rulerom.css

extra:
  analytics:
    provider: yandex
    property: 95291159

nav:
  - Главная: 'index.md'
  - Руководства:
    - 🌟 Пошаговое руководство: 'article/onboarding.md'
    - Установка: 'howto/setup.md'
    - macOS: 'howto/macos.md'
    - WebAssembly: 'howto/wasm.md'
    - Hello world: 'howto/hello-world.md'
  - Справочник:
    - Общие типы: 'base/common.md'
    - Базовые интерейсы: 'base/interfaces.md'
    - События: 'base/event.md'
    - Графика: 'base/graphic.md'

    - Визуальные темы: 'base/theme.md'
    - Локали: 'base/locale.md'
    - Конфиг: 'base/config.md'
    - Плоская модель владения: 'base/ownership.md'

    - Главный цикл приложения: 'base/main-loop.md'
    - Ресурсы: 'base/resources.md'
    - Многопоточнось: 'base/multi-threading.md'
    - Unicode: 'base/unicode.md'
    - Обработка ошибок: 'base/error-handling.md'
    - Транзиентность / Модальность: 'base/transient.md'
    - Зависимости: 'base/dependencies.md'
  - Контролы:
    - Все: 'controls/all.md'
    
    - Кнопка: 'controls/button.md'
    - Изображение: 'controls/image.md'
    - Поле ввода: 'controls/input.md'
    - Список: 'controls/list.md'
    - Меню: 'controls/menu.md'
    - Сообщение: 'controls/message.md'
    - Панель: 'controls/panel.md'
    - Прогресс: 'controls/progress.md'
    - Селектор: 'controls/select.md'
    - Регулятор: 'controls/slider.md'
    - Разделитель: 'controls/splitter.md'
    - Подсказка: 'controls/tooltip.md'
    - Трей: 'controls/tray.md'

  - О библиотеке:
    - Лицензия: 'about/licence.md'
    - Контакты: 'about/contacts.md'
