site_name: libWUI official documentation 🏛️
site_url: https://libwui.org/doc/

copyright: Copyright &copy; 2021–2026 WUI contributors

theme:
  name: material
  language: en
  palette:
    scheme: slate
  features:
    - navigation.tabs
    - navigation.sections
  custom_dir: ../overrides

extra_css:
  - assets/rulerom.css

extra:
  alternate:
    - name: English
      link: https://libwui.org/doc/
      lang: en
    - name: Русский
      link: https://libwui.org/doc_ru/
      lang: ru
  analytics:
    provider: yandex
    property: 95291159

nav:
  - Home: 'index.md'
  - Onboarding:
    - Article: 'article/onboarding.md'
  - Manuals:
    - Installation: 'howto/setup.md'
    - macOS: 'howto/macos.md'
    - WebAssembly: 'howto/wasm.md'
    - Hello world: 'howto/hello-world.md'

  - Handbook:
    - Common types: 'base/common.md'
    - Events: 'base/event.md'
    - Graphics: 'base/graphic.md'
    - Basic Interfaces: 'base/interfaces.md'

    - Visual Themes: 'base/theme.md'
    - Locales: 'base/locale.md'
    - Config: 'base/config.md'
    - Flat Control Ownership: 'base/ownership.md'

    - Main application loop: 'base/main-loop.md'
    - Resources: 'base/resources.md'
    - Multi-threading: 'base/multi-threading.md'
    - Unicode: 'base/unicode.md'
    - Error handling: 'base/error-handling.md'
    - Transient / Modal: 'base/transient.md'
    - Dependencies: 'base/dependencies.md'

  - Controls:
    - All: 'controls/all.md'
    
    - Text: 'controls/text.md'
    - Scroll: 'controls/scroll.md'
    - Button: 'controls/button.md'
    - Image: 'controls/image.md'
    - Text input: 'controls/input.md'
    - List: 'controls/list.md'
    - Menu: 'controls/menu.md'
    - Message: 'controls/message.md'
    - Panel: 'controls/panel.md'
    - Progress: 'controls/progress.md'
    - Select: 'controls/select.md'
    - Slider: 'controls/slider.md'
    - Splitter: 'controls/splitter.md'
    - Tooltip: 'controls/tooltip.md'
    - Tray: 'controls/tray.md'

  - About the Library:
    - License: 'about/licence.md'
    - Contacts: 'about/contacts.md'

validation:
  links:
    anchors: warn
    unrecognized_links: warn
